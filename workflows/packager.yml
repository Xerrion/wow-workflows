name: Package and Upload (reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        description: "The tag to package (e.g. 1.2.3)"
        required: true
        type: string
    secrets:
      CF_API_KEY:
        required: false
      WAGO_API_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package and Upload
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Fetch changelog script
        shell: bash
        run: |
          mkdir -p scripts
          curl -sSfL \
            "https://raw.githubusercontent.com/Xerrion/wow-workflows/main/scripts/generate_changelog.sh" \
            -o scripts/generate_changelog.sh
          chmod +x scripts/generate_changelog.sh

      - name: Generate changelog
        run: bash scripts/generate_changelog.sh

      - name: Package and upload
        uses: BigWigsMods/packager@v2
