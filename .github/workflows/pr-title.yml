name: PR Title (reusable)

on:
  workflow_call:

    # Called from a pull_request_target workflow so fork PRs can be checked with a
    # token that can read the PR. This is safe only because the job never checks out
    # or executes PR code: it validates the title string from the event payload.
permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message, and release-please
      # derives version bumps from it, so it must be a conventional commit.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            test
            docs
            doc
            build
            ci
            chore
            revert
