name: PR Title (reusable)

on:
  workflow_call:

    # Called from a pull_request workflow. The job only reads the PR title from the
    # event payload and never checks out PR code, so the read-only token that fork
    # PRs get is enough.
permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message, and release-please
      # derives version bumps from it, so it must be a conventional commit.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            test
            docs
            doc
            build
            ci
            chore
            revert
