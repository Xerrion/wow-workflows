name: Package and Upload (reusable)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The tag to package (e.g. 1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "The tag to package (e.g. 1.2.3)"
        required: true
        type: string
    secrets:
      CF_API_KEY:
        required: false
      WAGO_API_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: packager-${{ github.repository }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and Upload
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Checkout reusable workflow scripts
        uses: actions/checkout@v6
        with:
          repository: Xerrion/wow-workflows
          ref: ${{ github.job_workflow_sha }}
          sparse-checkout: scripts
          path: .wow-workflows

      - name: Generate changelog
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: bash .wow-workflows/scripts/generate_changelog.sh --no-sub-commits --linkify-prs

      - name: Package and upload
        uses: BigWigsMods/packager@v2
