name: TOC Update (reusable)

on:
  workflow_call:
    inputs:
      flavors:
        description: |-
          Space-separated list of game flavors to check.
          Valid: retail, classic, vanilla, tbc
        required: false
        type: string
        default: "retail classic vanilla tbc"
      base-branch:
        description: "Base branch for the PR"
        required: false
        type: string
        default: "master"

concurrency:
  group: toc-update-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-toc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-branch }}

      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          repository: Xerrion/wow-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .wow-workflows
          sparse-checkout: scripts
          # Read-only clone of a public repo; leaving the token in .git/config here
          # would expose it to the scripts this checkout provides.
          persist-credentials: false

      # Build --flavor args from the space-separated input and run the updater
      - name: Update TOC versions
        shell: bash
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: |
          args=()
          for flavor in $FLAVORS; do
            args+=(--flavor "$flavor")
          done
          bash .wow-workflows/scripts/update_toc_versions.sh "${args[@]}"

      # Detect whether any .toc files were modified by the update script
      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No TOC changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "TOC changes detected:"
            git diff --name-only
            # The diff is untrusted content: a literal "EOF" line would close the
            # multiline block early, so use an unguessable delimiter.
            DELIMITER="diff_summary_$(openssl rand -hex 16)"
            {
              echo "diff_summary<<$DELIMITER"
              git diff --unified=0 -- '*.toc' | grep -E '^[+-]## Interface' || echo "See diff for details"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          fi

      # Open a PR (or force-push to an existing one) with the updated TOC files
      - name: Create or update PR
        if: steps.diff.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          # Passed through the environment rather than interpolated into the script:
          # the diff is untrusted multiline text and would otherwise be executable.
          DIFF_SUMMARY: ${{ steps.diff.outputs.diff_summary }}
        run: |
          BRANCH="chore/toc-interface-version"
          TITLE="chore: update TOC Interface versions"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create or switch to the update branch
          git checkout -B "$BRANCH"

          # Stage and commit changes
          git add -A '*.toc'
          git commit -m "$TITLE"

          # Force-push the branch (overwrites previous auto-update if still open).
          # --force-with-lease needs a value to compare the remote ref against, and the
          # shallow checkout has no remote-tracking ref for the update branch. Read the
          # remote tip directly; an empty result becomes an empty lease, which git reads
          # as "the ref must not exist yet", which is correct for the first run.
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          git push --force-with-lease="$BRANCH:$REMOTE_SHA" origin "$BRANCH"

          # Ensure the automated label exists
          gh label create "automated" --description "Auto-generated changes" --color "ededed" 2>/dev/null || true

          # Build a PR body that includes the actual version diff
          printf -v BODY 'Automated update of `## Interface` versions in TOC files based on latest Blizzard CDN data.\n\n```diff\n%s\n```' "$DIFF_SUMMARY"

          # Create PR if one doesn't exist, otherwise the existing PR auto-updates
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "automated"
          else
            echo "PR already exists for branch ${BRANCH}, force-push updated it"
          fi
