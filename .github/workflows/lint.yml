name: Lint (reusable)

on:
  workflow_call:
    inputs:
      run-tests:
        description: "Run busted test suite after linting"
        required: false
        type: boolean
        default: false

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color

  test:
    name: Busted Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - name: Run tests
        run: busted --verbose
