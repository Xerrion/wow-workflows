name: Lint (reusable)

on:
  workflow_call:
    inputs:
      run-tests:
        description: "Run busted test suite after linting"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Keyed on the PR number so a push to one PR never cancels another PR's required
# check. The github.ref fallback keeps the key correct on triggers that have no
# pull_request payload.
concurrency:
  group: lint-${{ github.repository }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::Callers must trigger on pull_request. Under pull_request_target a bare checkout lints the base branch, not the PR."
          exit 1
      - uses: actions/checkout@v7
      - uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color

  test:
    name: Busted Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::Callers must trigger on pull_request. Under pull_request_target a bare checkout lints the base branch, not the PR."
          exit 1
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - name: Run tests
        run: busted --verbose
