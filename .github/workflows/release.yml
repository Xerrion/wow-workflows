name: Release (reusable)

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please config"
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Path to release-please manifest"
        required: false
        type: string
        default: ".release-please-manifest.json"
    secrets:
      CF_API_KEY:
        required: false
      WAGO_API_TOKEN:
        required: false
    outputs:
      release_created:
        description: "Whether a release was created (true/false)"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The release tag name (e.g. v1.2.3)"
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  package:
    name: Package and Upload
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Fetch changelog script
        shell: bash
        run: |
          mkdir -p scripts
          curl -sSfL \
            "https://raw.githubusercontent.com/Xerrion/wow-workflows/main/scripts/generate_changelog.sh" \
            -o scripts/generate_changelog.sh
          chmod +x scripts/generate_changelog.sh

      - name: Generate changelog
        run: bash scripts/generate_changelog.sh

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_REF: refs/tags/${{ needs.release-please.outputs.tag_name }}
