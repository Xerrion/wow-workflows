[package]
name = "update-toc-versions"
version = "0.1.0"
edition = "2021"
description = "Fetch latest WoW interface versions from Blizzard CDN and update .toc files"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
walkdir = "2"
